[workspace]
resolver = "2"
members = ["crates/input", "crates/anim", "crates/core", "crates/render", "crates/render-wgpu"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/bytegodpat-web/Shutter"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shutter-anim = { path = "crates/anim" }
shutter-core = { path = "crates/core" }
shutter-render = { path = "crates/render" }
tiny-skia = "0.11"
wgpu = "30.0.1"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
